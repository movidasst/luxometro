name: Deploy Luxometro payload

on:
  push:
    branches:
      - main
    paths:
      - '.upload/luxometro/**'
      - '.github/workflows/deploy-luxometro.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify simulator package
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/luxometro/payload.part.* > /tmp/luxometro.b64
          base64 --decode /tmp/luxometro.b64 > /tmp/luxometro.tar.xz
          echo '7e08e1e764ca4dd4e40e603074322d2f047f8951d6ece45009ebf2f8fcc81f4a  /tmp/luxometro.tar.xz' | sha256sum --check -
          tar -xJf /tmp/luxometro.tar.xz -C .
          rm -rf .upload/luxometro

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f CNAME
          test -f assets/logo-movida-sst-plus.svg
          node --check app.js
          grep -q 'luxometro.movidasst.com' CNAME

      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Deploy Luxómetro simulator'
          git push origin HEAD:main
